aid: august
name: August
description: >-
  August (August Home) makes Wi-Fi smart locks, keypads, doorbell cameras, and
  the August Connect bridge for keyless, app-controlled home entry. Founded in
  San Francisco and originally backed by Bessemer Venture Partners and Uncork
  Capital, August was acquired by Assa Abloy and its product line is now unified
  with Yale Home; the two brands share the August mobile app. August does not
  publish a public device-control API for consumers — third-party integrations
  rely on community-reverse-engineered endpoints or aggregators such as Seam, and
  Yale/August partners use the developer.august.com portal. Its august.com
  storefront (hosted on Shopify) does, however, expose an agent-native commerce
  surface: a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp and a hosted shopping MCP server at /api/ucp/mcp for
  buy-for-me agents, alongside Shopify customer-account OpenID Connect discovery.
